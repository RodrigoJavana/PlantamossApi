# Plantamoss 2026 - afinación ligera para desarrollo
timezone = 'America/Monterrey'
log_timezone = 'America/Monterrey'

# Registro de consultas lentas (> 500 ms)
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on

# Memoria modesta (contenedor de desarrollo)
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB
max_connections = 100
